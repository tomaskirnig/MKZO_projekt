#!KAMAILIO
#
# Kamailio SIP Server Configuration for WebRTC / WebSockets & MariaDB
# Projekt: WebSockets v Kamailio (WebRTC SIP Proxy)
#

#!define WITH_MYSQL
#!define WITH_AUTH
#!define WITH_USRLOCDB
#!define WITH_TLS
#!define WITH_WEBSOCKETS

# --- Database & Port Definitions ---
#!substdef "!DBURL!mysql://kamailio:kamailiopw@mariadb/kamailio!g"
#!substdef "!SIP_PORT!5060!g"
#!substdef "!WS_PORT!8080!g"
#!substdef "!WSS_PORT!4443!g"

####### Global Parameters #########

### Log level (L_ERR=1, L_WARN=2, L_INFO=3, L_DBG=4)
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

### Process Children
fork=yes
children=4

### Network and Socket Bindings
listen=udp:0.0.0.0:SIP_PORT
listen=tcp:0.0.0.0:SIP_PORT
listen=tcp:0.0.0.0:WS_PORT
listen=tls:0.0.0.0:WSS_PORT

### TCP & TLS Tuning
tcp_connection_lifetime=3604
tcp_accept_no_cl=yes
tcp_rd_buf_size=16384
enable_tls=yes

####### Modules Section ########

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/:/usr/lib/kamailio/modules/"

# Core SIP modules
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "kex.so"
loadmodule "corex.so"

# Database & Authentication
loadmodule "db_mysql.so"
loadmodule "auth.so"
loadmodule "auth_db.so"

# TLS & WebSockets
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "nathelper.so"

####### Module Parameters #########

# ----- tm params -----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# ----- rr params -----
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)

# ----- registrar params -----
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "gruu_enabled", 0)

# ----- usrloc params -----
modparam("usrloc", "db_url", "DBURL")
modparam("usrloc", "db_mode", 2)

# ----- auth params -----
modparam("auth", "nonce_count", 1)
modparam("auth", "qop", "auth")

# ----- auth_db params -----
modparam("auth_db", "db_url", "DBURL")
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "load_credentials", "")

# ----- tls params -----
modparam("tls", "config", "/etc/kamailio/tls.cfg")

# ----- nathelper params -----
modparam("nathelper|registrar", "received_avp", "$avp(RECEIVED)")

####### Routing Logic ########

request_route {
    # Check initial requests
    route(REQINIT);

    # WebSocket NAT traversal & Aliasing
    if (nat_uac_test(64)) {
        force_rport();
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            if (!add_contact_alias()) {
                xlog("L_ERR", "Chyba pri prirazeni aliasu kontaktu <$ct>\n");
                sl_send_reply("400", "Bad Request");
                exit;
            }
        }
    }

    # Handle dialog requests (ACK, BYE, etc.)
    route(WITHINDLG);

    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    t_check_trans();

    # Authenticate requests
    route(AUTH);

    # Record routing for dialogs
    remove_hf("Route");
    if (is_method("INVITE")) {
        record_route();
    }

    # Handle Registrations
    route(REGISTRAR);

    if ($rU == $null) {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    # Location lookup & Relay
    route(LOCATION);
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Request initialization & sanity checks
route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Nevalidni SIP zprava od $si:$sp\n");
        exit;
    }

    if (uri == myself && is_method("OPTIONS") && !(uri =~ "sip:.*[@]+.*")) {
        options_reply();
        exit;
    }
}

# Requests within existing dialogs
route[WITHINDLG] {
    if (has_totag()) {
        if (loose_route()) {
            if ($du == "") {
                if (!handle_ruri_alias()) {
                    xlog("L_ERR", "Chybny alias <$ru>\n");
                    sl_send_reply("400", "Bad Request");
                    exit;
                }
            }
            route(RELAY);
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    t_relay();
                    exit;
                } else {
                    exit;
                }
            }
            sl_send_reply("404", "Not Found");
        }
        exit;
    }
}

# Registrace uzivatelu
route[REGISTRAR] {
    if (is_method("REGISTER")) {
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }
}

# Overeni a smerovani na registrovanou lokaci
route[LOCATION] {
    if (!lookup("location")) {
        $var(rc) = $rc;
        t_newtran();
        switch ($var(rc)) {
            case -1:
                send_reply("480", "Temporarily Unavailable");
                exit;
            case -2:
                send_reply("405", "Method Not Allowed");
                exit;
            case -3:
                send_reply("500", "Server Internal Error");
                exit;
        }
    }
}

# Autentizace proti MariaDB subscriber tabulce
route[AUTH] {
    if (is_method("REGISTER") || from_uri == myself) {
        if (!auth_check("$fd", "subscriber", "1")) {
            auth_challenge("$fd", "0");
            exit;
        }
        if (!is_method("REGISTER")) {
            consume_credentials();
        }
    }
    if (from_uri != myself && uri != myself) {
        sl_send_reply("403", "Forbidden");
        exit;
    }
}

# Zpracovani odpovedi
onreply_route {
    if (nat_uac_test(64)) {
        add_contact_alias();
    }
}

# HTTP / WebSocket Handshake Upgrade
event_route[xhttp:request] {
    set_reply_close();
    set_reply_no_connect();

    if ($Rp != WS_PORT && $Rp != WSS_PORT) {
        xlog("L_WARN", "HTTP pozadavek odmitnut na portu $Rp\n");
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }

    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm =~ "GET") {
        if (ws_handle_handshake()) {
            exit;
        }
    }

    xhttp_reply("404", "Not Found", "", "");
}

# Uzavreni WebSocket spojeni
event_route[websocket:closed] {
    xlog("L_INFO", "WebSocket spojeni od $si:$sp bylo ukonceno\n");
}
