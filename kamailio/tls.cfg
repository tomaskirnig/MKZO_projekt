# TLS configuration for Kamailio (WSS on port 4443)

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/certs/privkey.pem
certificate = /etc/kamailio/certs/fullchain.pem
ca_list = /etc/kamailio/certs/fullchain.pem

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
